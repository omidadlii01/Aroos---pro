# زیرساخت محلی BridalOS — پستگرس، Redis و ذخیره‌سازی S3-سازگار
#
# ⚠️ وضعیت اعتبارسنجی: در محیط ساخت این نسخه، Docker در دسترس نبود؛ بنابراین
# اجرای این فایل **تأیید نشده** است و در گزارش فاز به‌عنوان Blocked ثبت شده.
# برنامه‌های Node در همین نسخه بیرون Docker اجرا می‌شوند (README را ببینید).
#
# اجرا: docker compose -f infra/docker-compose.yml up -d
name: bridalos-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: bridalos-postgres
    environment:
      POSTGRES_USER: bridalos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-locally}
      POSTGRES_DB: bridalos
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bridalos -d bridalos']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: bridalos-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: bridalos-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-bridalos-local}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-bridalos-local-secret}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
